name = "pivot-parlor-text"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[queues.consumers]]
queue = "site-text-queue"
max_batch_size = 1
max_batch_timeout = 60

[[queues.producers]]
binding = "SITE_ASSEMBLE_QUEUE"
queue = "site-assemble-queue"

[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

[vars]
ENVIRONMENT = "production"

# Secrets:
#   OPENROUTER_API_KEY
