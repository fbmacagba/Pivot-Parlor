name = "pivot-parlor-images"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[observability]
enabled = true
head_sampling_rate = 1

[[queues.consumers]]
queue = "site-images-queue"
max_batch_size = 1
max_batch_timeout = 60

[[queues.producers]]
binding = "SITE_ASSEMBLE_QUEUE"
queue = "site-assemble-queue"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "pivot-parlor-assets"

[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

[vars]
ENVIRONMENT = "production"
ASSET_BASE_URL = "https://pivot-parlor-api.bmorris0565.workers.dev"

# Secrets (wrangler secret put --name pivot-parlor-images):
#   OPENROUTER_API_KEY
