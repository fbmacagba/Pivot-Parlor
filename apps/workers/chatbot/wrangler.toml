name = "pivot-parlor-chatbot"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

[vars]
ENVIRONMENT = "production"
PLATFORM_URL = "https://pivot-parlor-api.bmorris0565.workers.dev"

# Secrets:
#   OPENROUTER_API_KEY
#   OPENAI_API_KEY      (optional: direct OpenAI route when the platform chatbot model is openai-api/*)
#   ANTHROPIC_API_KEY   (optional: direct Anthropic route when the platform chatbot model is anthropic-api/*)
#   TURNSTILE_SECRET_KEY
