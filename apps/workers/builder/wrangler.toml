name = "pivot-parlor-assembler"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[observability]
enabled = true
head_sampling_rate = 1

# Workers Issues: groups crashes, failed queue runs and logged errors, and
# the account's Real-Time Issue alert emails the owner. Needs Wrangler
# 4.134.0+; a deploy without this key turns Issues off. Runbook:
# docs/runbooks/production-alerting.md
[observability.issues]
enabled = true

[[queues.consumers]]
queue = "site-assemble-queue"
max_batch_size = 1
max_batch_timeout = 60

[[queues.producers]]
binding = "SITE_ASSEMBLE_QUEUE"
queue = "site-assemble-queue"

[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

[vars]
ENVIRONMENT = "production"
