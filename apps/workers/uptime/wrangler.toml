# Production uptime monitor. Deployed by hand (not by CI), like the other
# background workers. Runbook: docs/runbooks/production-alerting.md
name = "pivot-parlor-uptime"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# Fetch the public site exactly as a visitor's browser would, through the
# zone's front door, never a same-account shortcut.
compatibility_flags = ["global_fetch_strictly_public"]
# No public surface: the monitor only runs on its cron.
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# A failing check logs an Error; Workers Issues groups it and the account's
# Real-Time Issue alert emails the owner. A deploy without this key turns
# Issues off (Wrangler 4.134.0+).
[observability.issues]
enabled = true

[vars]
SITE_ORIGIN = "https://pivotparlor.com"
API_ORIGIN = "https://api.pivotparlor.com"
# Public page, services and slots; the launch purge keeps the shop, services and staff.
DEMO_SHOP_SLUG = "ferdyms-barber-shop-014"
