name = "pivot-parlor-web"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./build/client"

[vars]
API_URL = "https://api.pivotparlor.com"
APP_DOMAIN = "pivotparlor.com"

# Secrets (set via `wrangler secret put --config apps/web/wrangler.toml`):
#   JWT_SECRET
#   OPENROUTER_API_KEY   ← used by marketing chatbot (/api/chat) and worker AI routes

# The website's server code reaches the API over this binding, not the public
# internet, so the API sees each visitor's IP (functions/_middleware.ts and
# app/lib/apiTransport.ts). Over the internet every visitor arrived as one
# Cloudflare address and shared one set of rate limits.
# scripts/ci-set-web-staging-vars.mjs points it at the staging worker.
[[services]]
binding = "API"
service = "pivot-parlor-api"

# KV binding — shared with worker for rate limiting the marketing chatbot
[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"
