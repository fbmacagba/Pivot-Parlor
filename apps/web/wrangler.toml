name = "pivot-parlor-web"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./build/client"

[vars]
API_URL = "https://api.pivotparlor.com"
APP_DOMAIN = "pivotparlor.com"

# Secrets (set via `wrangler secret put --config apps/web/wrangler.toml`):
#   JWT_SECRET
#   (OPENROUTER_API_KEY was deleted on 2026-11-18: the marketing chatbot
#   (/api/chat) is answered by the API, MARKETING_CHAT below. Only a rollback
#   to a build from before then would need it back, or its chat says
#   "Chat unavailable.")

# The website's server code reaches the API over this binding, not the public
# internet, so the API sees each visitor's IP (functions/_middleware.ts and
# app/lib/apiTransport.ts). Over the internet every visitor arrived as one
# Cloudflare address and shared one set of rate limits.
# scripts/ci-set-web-staging-vars.mjs points it at the staging worker.
[[services]]
binding = "API"
service = "pivot-parlor-api"

# Server errors in loaders, actions and the render reach the owner's alert
# email through the API's WebErrors entrypoint (app/lib/serverErrors.ts and
# apps/worker/src/web-errors.ts): Pages Functions have no Workers Issues.
# It is not reachable from the internet. scripts/ci-set-web-staging-vars.mjs
# points it at the staging worker, whose Issues are off.
[[services]]
binding = "WEB_ERRORS"
service = "pivot-parlor-api"
entrypoint = "WebErrors"

# Pip, the marketing chatbot (/api/chat): the website keeps the per-visitor
# limit and the body checks, and the API's MarketingChat entrypoint
# (apps/worker/src/marketing-chat.ts) calls the model, so each reply is
# audited and in the cost log. It is not reachable from the internet.
# scripts/ci-set-web-staging-vars.mjs points it at the staging worker.
[[services]]
binding = "MARKETING_CHAT"
service = "pivot-parlor-api"
entrypoint = "MarketingChat"

# KV binding — shared with worker for rate limiting the marketing chatbot
[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"
