name = "pivot-parlor-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./build/client"

[vars]
API_URL = "https://api.pivotparlor.com"
APP_DOMAIN = "pivotparlor.com"

# Secrets (set via `wrangler secret put --config apps/web/wrangler.toml`):
#   JWT_SECRET
#   OPENROUTER_API_KEY   ← used by marketing chatbot (/api/chat) and worker AI routes

# KV binding — shared with worker for rate limiting the marketing chatbot
[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"
