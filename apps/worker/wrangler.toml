name = "pivot-parlor-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs — structured logs + errors queryable in the dashboard
# (Workers & Pages → pivot-parlor-api → Logs). WS-5 observability.
[observability]
enabled = true
head_sampling_rate = 1

# Workers Issues: groups crashes, 5xx replies and logged errors, and the
# account's Real-Time Issue alert emails the owner. Needs Wrangler 4.134.0+;
# a deploy without this key turns Issues off. Runbook:
# docs/runbooks/production-alerting.md
[observability.issues]
enabled = true

[vars]
ENVIRONMENT = "production"
ASSET_BASE_URL = "https://pivot-parlor-api.bmorris0565.workers.dev"
APP_URL = "https://pivotparlor.com"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

# KV Namespace (sessions + slot cache + theme cache)
[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

# R2 bucket for generated shop assets (images)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "pivot-parlor-assets"

# Audit archive (retention-locked; create + lock BEFORE deploying, see docs/runbooks/audit-trail-rollout.md)
[[r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "pivot-parlor-audit"

# Queue (booking reminders)
[[queues.producers]]
binding = "QUEUE"
queue = "pivot-parlor-reminders"

[[queues.consumers]]
queue = "pivot-parlor-reminders"
max_batch_size = 10
max_batch_timeout = 30
# Retries double as scheduling hops for >12h reminders (delaySeconds caps at
# 12h per hop), so the budget must cover hops + genuine failure retries.
max_retries = 10

# Site generation pipeline
[[queues.producers]]
binding = "site_research_queue"
queue = "site-research-queue"

# Canonical booking system (WS-1): public booking + slots proxy through this.
# Deploy pivot-parlor-booking BEFORE this worker so the binding resolves.
[[services]]
binding = "BOOKING"
service = "pivot-parlor-booking"

# Per-IP limit on CSP violation reports (src/routes/csp-report.ts). Counted in
# memory per Cloudflare location, no KV writes. namespace_id is account-wide:
# 4201 and 4202 belong to another project's worker.
[[ratelimits]]
name = "CSP_REPORT_LIMITER"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 20
  period = 60

# Per-route limit on website server-error reports (src/web-errors.ts, reached
# only over the website's WEB_ERRORS service binding). 7101 and 7102 are the
# CSP limiter's.
[[ratelimits]]
name = "WEB_ERROR_LIMITER"
namespace_id = "7103"

  [ratelimits.simple]
  limit = 30
  period = 60

# Cron triggers:
# * * * * * — audit sealer (seal new entries into the chain + archive)
# 03:00 UTC — LEG-6 retention sweep (WS-8, bounded + idempotent)
# 08:00 UTC — send 24h-ahead reminders
# 20:00 UTC — EOD developer alert (booking count)
[triggers]
crons = ["* * * * *", "0 3 * * *", "0 8 * * *", "0 20 * * *"]

[dev]
port = 8787
local_protocol = "http"

# Secrets (set via `wrangler secret put`):
#   JWT_SECRET
#   OPENROUTER_API_KEY
#   OPENAI_API_KEY        (direct OpenAI route; optional, hides the group when unset)
#   ANTHROPIC_API_KEY     (direct Anthropic route; optional, hides the group when unset)
#   GOOGLE_AI_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   FACEBOOK_OAUTH_APP_ID
#   FACEBOOK_OAUTH_APP_SECRET
#   LINKEDIN_OAUTH_CLIENT_ID
#   LINKEDIN_OAUTH_CLIENT_SECRET

# ─── Staging ──────────────────────────────────────────────────────────────────
# Deploy:   npx wrangler deploy --env staging
# Migrate:  node ../../scripts/migrate.mjs --remote --db pivot-parlor-db-staging
# Secrets:  npx wrangler secret put JWT_SECRET --env staging   (staging-only values)
# E2E fixtures are enabled here; NEVER set E2E_FIXTURES in production above.

[env.staging]
name = "pivot-parlor-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
E2E_FIXTURES = "true"
ASSET_BASE_URL = "https://pivot-parlor-api-staging.bmorris0565.workers.dev"
APP_URL = "https://pivot-parlor-api-staging.bmorris0565.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db-staging"
database_id = "87305736-6077-42a4-ae2b-86a5203ab4c4"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "39a1e52d5dd34cc7bdf19b30d4b7212d"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "pivot-parlor-assets-staging"

[[env.staging.r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "pivot-parlor-audit-staging"

[[env.staging.queues.producers]]
binding = "QUEUE"
queue = "pivot-parlor-reminders-staging"

[[env.staging.queues.consumers]]
queue = "pivot-parlor-reminders-staging"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 10

[[env.staging.queues.producers]]
binding = "site_research_queue"
queue = "site-research-queue-staging"

[[env.staging.services]]
binding = "BOOKING"
service = "pivot-parlor-booking-staging"

# Per-IP limit on CSP violation reports (src/routes/csp-report.ts). Counted in
# memory per Cloudflare location, no KV writes. namespace_id is account-wide:
# 4201 and 4202 belong to another project's worker.
[[env.staging.ratelimits]]
name = "CSP_REPORT_LIMITER"
namespace_id = "7102"

  [env.staging.ratelimits.simple]
  limit = 20
  period = 60

# Per-route limit on website server-error reports (src/web-errors.ts, reached
# only over the website's WEB_ERRORS service binding). 7101 and 7102 are the
# CSP limiter's.
[[env.staging.ratelimits]]
name = "WEB_ERROR_LIMITER"
namespace_id = "7104"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[env.staging.triggers]
crons = ["* * * * *", "0 3 * * *", "0 8 * * *", "0 20 * * *"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

# Off on staging: E2E runs log errors on purpose, and the alert is account-wide.
[env.staging.observability.issues]
enabled = false
