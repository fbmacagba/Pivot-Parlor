name = "pivot-parlor-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ASSET_BASE_URL = "https://pivot-parlor-api.bmorris0565.workers.dev"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "pivot-parlor-db"
database_id = "515a7270-81b4-4935-b106-15aeee639f57"

# KV Namespace (sessions + slot cache + theme cache)
[[kv_namespaces]]
binding = "KV"
id = "12eca802e7ff47c2a5358da0f985eecd"

# R2 bucket for generated shop assets (images)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "pivot-parlor-assets"

# Queue (booking reminders)
[[queues.producers]]
binding = "QUEUE"
queue = "pivot-parlor-reminders"

[[queues.consumers]]
queue = "pivot-parlor-reminders"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Site generation pipeline
[[queues.producers]]
binding = "site_research_queue"
queue = "site-research-queue"

# Cron trigger: 08:00 UTC daily → send 24-hour-ahead reminders
[triggers]
crons = ["0 8 * * *"]

[dev]
port = 8787
local_protocol = "http"

# Secrets (set via `wrangler secret put`):
#   JWT_SECRET
#   OPENROUTER_API_KEY
#   GOOGLE_AI_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
