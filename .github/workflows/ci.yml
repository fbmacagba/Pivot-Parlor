name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Type check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run check-types

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The build can pass while its bundle cannot render in workerd (2026-11-14:
      # React's Node renderer got bundled and every page answered 500). This
      # serves the web build the way Pages runs it and GETs pages.
      - name: Smoke-test the web build under workerd
        run: node scripts/smoke-build.mjs
        working-directory: apps/web
