name: Deploy Remix Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/types/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      # Opt into Node 24 for actions/checkout & setup-node (Node 20 runner deprecation)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Remix app
        run: npm run build --workspace=apps/web

      # Static + Pages Functions (Remix SSR) — do not deploy ./build/client alone.
      - name: Prepare Pages deploy bundle (.pages-dist)
        run: node scripts/prepare-pages-deploy.mjs
        working-directory: apps/web

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          # Match deploy-worker.yml and Cloudflare docs (same token as Workers deploy)
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy ./.pages-dist --project-name=pivot-parlor-web --branch=main --commit-dirty=true
