name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/workers/booking/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "packages/llm/**"
      - "packages/audit/**"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types --workspace=worker

      - name: Unit tests
        run: npm test --workspace=worker

      - name: Unit tests (booking worker)
        run: npm test --workspace=pivot-parlor-booking

      # Tracked migrations (schema_migrations table). One-time prerequisite on an
      # existing database: node scripts/migrate.mjs --remote --baseline
      - name: Run D1 migrations
        run: node scripts/migrate.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The booking worker deploys FIRST: the main worker's BOOKING service
      # binding must resolve to an existing worker (WS-1).
      - name: Deploy Booking Worker
        run: npx wrangler deploy --config apps/workers/booking/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
