name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/workers/booking/**"
      - "packages/types/**"
      - "packages/utils/**"
  workflow_dispatch:

# Serialize production deploys, and with them the D1 migrations each run
# applies. Without this, two merges seconds apart run migrate.mjs and deploy in
# parallel, and the older commit can land last. With a group, runs go one at a
# time; a newer push replaces any run still waiting, and each run deploys main
# at its commit, so the last deploy is always the newest code.
concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types --workspace=worker

      - name: Unit tests
        run: npm test --workspace=worker

      - name: Unit tests (booking worker)
        run: npm test --workspace=pivot-parlor-booking

      # Tracked migrations (schema_migrations table). One-time prerequisite on an
      # existing database: node scripts/migrate.mjs --remote --baseline
      - name: Run D1 migrations
        run: node scripts/migrate.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The booking worker deploys FIRST: the main worker's BOOKING service
      # binding must resolve to an existing worker (WS-1).
      - name: Deploy Booking Worker
        run: npx wrangler deploy --config apps/workers/booking/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
